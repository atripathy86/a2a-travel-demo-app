services:
  ui:
    build:
      context: ./ui
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - ORCHESTRATOR_URL=http://orchestrator:9000
      - ITINERARY_AGENT_URL=http://itinerary:9001
      - BUDGET_AGENT_URL=http://budget:9002
      - RESTAURANT_AGENT_URL=http://restaurant:9003
      - WEATHER_AGENT_URL=http://weather:9005
    depends_on:
      - orchestrator
      - itinerary
      - budget
      - restaurant
      - weather
    networks:
      - a2a-network

  orchestrator:
    build:
      context: ./agents
    command: python -m orchestrator.agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ORCHESTRATOR_PORT=9000
      - ITINERARY_AGENT_URL=http://itinerary:9001
      - BUDGET_AGENT_URL=http://budget:9002
      - RESTAURANT_AGENT_URL=http://restaurant:9003
      - WEATHER_AGENT_URL=http://weather:9005
      # LOG_LEVEL options: debug (verbose), info (standard), warning (quiet), error (silent)
      - LOG_LEVEL=warning 
    ports:
      - "9000:9000"
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9000/ | grep -q 'Method Not Allowed'"]
      interval: 10s
      timeout: 5s
      retries: 5

  itinerary:
    build:
      context: ./agents
    command: python -m itinerary.agent
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ITINERARY_PORT=9001
      - AGENT_URL=http://itinerary:9001/
      # LOG_LEVEL options: debug (verbose), info (standard), warning (quiet), error (silent)
      - LOG_LEVEL=warning 
    ports:
      - "9001:9001"
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/.well-known/agent-card.json"]
      interval: 10s
      timeout: 5s
      retries: 5

  budget:
    build:
      context: ./agents
    command: python -m budget.agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - BUDGET_PORT=9002
      - AGENT_URL=http://budget:9002/
      # Langfuse observability (optional)
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
      # LOG_LEVEL options: debug (verbose), info (standard), warning (quiet), error (silent)
      - LOG_LEVEL=warning 
    ports:
      - "9002:9002"
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/.well-known/agent-card.json"]
      interval: 10s
      timeout: 5s
      retries: 5

  restaurant:
    build:
      context: ./agents
    command: python -m restaurant.agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - RESTAURANT_PORT=9003
      - AGENT_URL=http://restaurant:9003/
      # Langfuse observability (optional)
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
      # LOG_LEVEL options: debug (verbose), info (standard), warning (quiet), error (silent)
      - LOG_LEVEL=warning 
    ports:
      - "9003:9003"
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003/.well-known/agent-card.json"]
      interval: 10s
      timeout: 5s
      retries: 5

  weather:
    build:
      context: ./agents
    command: python -m weather.agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - WEATHER_PORT=9005
      - AGENT_URL=http://weather:9005/
      # Langfuse observability (optional)
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
      # LOG_LEVEL options: debug (verbose), info (standard), warning (quiet), error (silent)
      - LOG_LEVEL=warning 
    ports:
      - "9005:9005"
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9005/.well-known/agent-card.json"]
      interval: 10s
      timeout: 5s
      retries: 5

  adk-web:
    build:
      context: ./agents
    command: adk web --host=0.0.0.0 --port 8080 .
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    ports:
      - "8080:8080"
    networks:
      - a2a-network

networks:
  a2a-network:
    driver: bridge
