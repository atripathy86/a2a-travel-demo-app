services:
  ui:
    build:
      context: ./ui
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - ORCHESTRATOR_URL=http://orchestrator:9000
      - ITINERARY_AGENT_URL=http://itinerary:9001
      - BUDGET_AGENT_URL=http://budget:9002
      - RESTAURANT_AGENT_URL=http://restaurant:9003
      - WEATHER_AGENT_URL=http://weather:9005
    depends_on:
      - orchestrator
      - itinerary
      - budget
      - restaurant
      - weather
    networks:
      - a2a-network

  orchestrator:
    build:
      context: ./agents
    command: python -m orchestrator.agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MODEL=${MODEL}
      - API_BASE=${API_BASE}
      - API_KEY=${API_KEY}
      - ORCHESTRATOR_PORT=9000
      - ITINERARY_AGENT_URL=http://itinerary:9001
      - BUDGET_AGENT_URL=http://budget:9002
      - RESTAURANT_AGENT_URL=http://restaurant:9003
      - WEATHER_AGENT_URL=http://weather:9005
      - LOG_LEVEL=warning
      - no_proxy=itinerary,budget,weather,restaurant,localhost,127.0.0.1
    ports:
      - "9000:9000"
    volumes:
      - ./.env.orchestrator.models.json:/app/.env.orchestrator.models.json:ro
      - ./.env.itinerary.models.json:/app/.env.itinerary.models.json:ro
      - ./.env.budget.models.json:/app/.env.budget.models.json:ro
      - ./.env.restaurant.models.json:/app/.env.restaurant.models.json:ro
      - ./.env.weather.models.json:/app/.env.weather.models.json:ro
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9000/ | grep -q 'Method Not Allowed'"]
      interval: 10s
      timeout: 5s
      retries: 5

  itinerary:
    build:
      context: ./agents
    command: python -m itinerary.agent
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MODEL=${MODEL}
      - API_BASE=${API_BASE}
      - API_KEY=${API_KEY}
      - ITINERARY_PORT=9001
      - AGENT_URL=http://itinerary:9001/
      - LOG_LEVEL=warning 
    ports:
      - "9001:9001"
    volumes:
      - ./.env.itinerary.models.json:/app/.env.itinerary.models.json:ro
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/.well-known/agent-card.json"]
      interval: 10s
      timeout: 5s
      retries: 5

  budget:
    build:
      context: ./agents
    command: python -m budget.agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MODEL=${MODEL}
      - API_BASE=${API_BASE}
      - API_KEY=${API_KEY}
      - BUDGET_PORT=9002
      - AGENT_URL=http://budget:9002/
      - LOG_LEVEL=warning 
    ports:
      - "9002:9002"
    volumes:
      - ./.env.budget.models.json:/app/.env.budget.models.json:ro
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/.well-known/agent-card.json"]
      interval: 10s
      timeout: 5s
      retries: 5

  restaurant:
    build:
      context: ./agents
    command: python -m restaurant.agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MODEL=${MODEL}
      - API_BASE=${API_BASE}
      - API_KEY=${API_KEY}
      - RESTAURANT_PORT=9003
      - AGENT_URL=http://restaurant:9003/
      - LOG_LEVEL=warning 
    ports:
      - "9003:9003"
    volumes:
      - ./.env.restaurant.models.json:/app/.env.restaurant.models.json:ro
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003/.well-known/agent-card.json"]
      interval: 10s
      timeout: 5s
      retries: 5

  weather:
    build:
      context: ./agents
    command: python -m weather.agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MODEL=${MODEL}
      - API_BASE=${API_BASE}
      - API_KEY=${API_KEY}
      - WEATHER_PORT=9005
      - AGENT_URL=http://weather:9005/
      - LOG_LEVEL=warning 
    ports:
      - "9005:9005"
    volumes:
      - ./.env.weather.models.json:/app/.env.weather.models.json:ro
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9005/.well-known/agent-card.json"]
      interval: 10s
      timeout: 5s
      retries: 5

  adk-web:
    build:
      context: ./agents
    command: adk web --host=0.0.0.0 --port 8080 .
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MODEL=${MODEL}
      - API_BASE=${API_BASE}
      - API_KEY=${API_KEY}
    ports:
      - "8080:8080"
    networks:
      - a2a-network

networks:
  a2a-network:
    driver: bridge
